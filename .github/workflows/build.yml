name: Build cal.diy image

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch oder Commit von calcom/cal.diy"
        default: main

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: build
          POSTGRES_PASSWORD: build
          POSTGRES_DB: calendso
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U build"
          --health-interval 5s --health-retries 20
    steps:
      - name: Platz auf dem Runner schaffen
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          docker system prune -af
          df -h /

      - uses: actions/checkout@v4
        with:
          repository: calcom/cal.diy
          ref: ${{ inputs.ref }}

      - name: "HANOBOT-Anpassung: Gast-Mails im Zeitformat des Gastgebers (24 Std.)"
        run: |
          f=packages/emails/src/templates/AttendeeScheduledEmail.tsx
          grep -q 'timeFormat={props.attendee?.timeFormat}' "$f" || { echo "Stelle nicht gefunden – Cal hat den Code geändert, Anpassung prüfen"; exit 1; }
          sed -i 's/timeFormat={props.attendee?.timeFormat}/timeFormat={props.attendee?.timeFormat ?? props.calEvent.organizer?.timeFormat}/' "$f"
          grep -n 'timeFormat=' "$f"

      - id: v
        run: echo "tag=$(date +%Y%m%d)-$(git rev-parse --short HEAD)-hb" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build und Push
        run: |
          IMG=ghcr.io/$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')/cal.diy
          docker build --network host \
            --build-arg NEXT_PUBLIC_WEBAPP_URL=http://localhost:3000 \
            --build-arg NEXT_PUBLIC_LICENSE_CONSENT=agree \
            --build-arg CALCOM_TELEMETRY_DISABLED=1 \
            --build-arg DATABASE_URL=postgresql://build:build@localhost:5432/calendso \
            -t $IMG:${{ steps.v.outputs.tag }} .
          docker push $IMG:${{ steps.v.outputs.tag }}
          echo "### Image: $IMG:${{ steps.v.outputs.tag }}" >> "$GITHUB_STEP_SUMMARY"
